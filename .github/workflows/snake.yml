name: Generate contribution snake

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF5DB1&color_dots=%230B1020,%23151C3B,%235B4B97,%23FF7BC5,%235CE1E6
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFB3D9&color_dots=%230B1020,%23151C3B,%235B4B97,%23FF7BC5,%235CE1E6

      - name: Publish generated animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
